<script>
const DATA={"units": {"E": "実存主義（P42-45）", "P": "公共性と他者（P46-49）", "J": "現代の政治思想（P50-53）", "B": "生命倫理（P54-57）", "N": "環境倫理（P58-60）", "C": "近代国家と立憲主義（P62-65）", "D": "民主政治（P66-71）"}, "contexts": {"A1": ["大問1　自己の生き方と実存", "高校生の甲は、周囲と同じ進路を選べば安心だと感じていた。しかし、「周りが選ぶから」という理由だけで自分の生き方を決めてよいのかと疑問を持った。乙は、他人の期待に応えることが人生の本質として最初から決まっているわけではなく、何を選んだかに責任を持つ必要があると話した。また丙は、世間で当たり前とされる価値が揺らいだとき、新しい価値を作り出すことの重要性を語った。"], "A2": ["大問2　対話・教育・社会の仕組み", "ある高校は、授業の成果を試験の平均点だけで評価していた。管理者は平均点を効率よく上げる手段を考えたが、一部の教員は「点数の上昇だけを目標にしてよいのか」と問い直した。生徒会でも、ルールの変更を多数決だけで即決せず、各人の根拠を確かめながら対話した。議論のなかでは、教室という場自体が社会的な規範によって形作られているという視点も提示された。"], "A3": ["大問3　公正な学校制度", "新しい学習支援制度を設計する委員会が開かれた。委員は自分が裕福な家庭の出身かどうか、将来どのような能力を持つかを知らないという条件で、公正な制度を考えるよう求められた。議論では、正当に得た財産の自由を重視する案、学校共同体にとっての価値を考える案、支援金が実際に学習の機会へ結びついているかを見る案など、さまざまな立場が出された。"], "A4": ["大問4　生命と環境の判断", "自治体では、再生医療を支える研究への助成と、病院の患者支援の充実が検討された。同時に、市内の森林開発計画についても話し合いが行われた。ある住民は「未来世代に自然資源を残す責任」を語り、別の住民は「人間以外の動植物や土地も一つの共同体として大切にするべきだ」と述べた。政策を考える際には、技術的に可能かどうかと倫理的に適切かどうかを分ける必要がある。"], "A5": ["大問5　国家と政治制度", "社会では、人々の利害が衝突することがある。そのため政治は共通のルールを設けるが、政府の権限が無制限では、人権が守られないおそれがある。近代の思想家は自然状態から国家の成立を説明し、権力を拘束するための憲法や権力分立が発展した。また現代の国家は、治安・国防だけでなく社会保障や経済政策にまで役割を広げている。"], "B1": ["大問1　選択・対話・近代の思想", "生徒Aは「自分の選択の正しさが確信できず悩むが、自分にとって切実な生き方を探したい」と語る。生徒Bは「制度は効率よく目標を達成するためだけに存在するのか、目標自体も問い直すべきだ」と言う。生徒Cは「意見が食い違っても、根拠を聞きながら共通理解を探せる」と話す。この三人の発言には、主体的に生きる思想と、社会的な対話を重視する思想が交差している。"], "B2": ["大問2　公正とケア", "市の学習支援事業では、家庭の事情や健康上の条件が異なる利用者に一律のサービスを提供していた。担当者は、実際に利用可能な機会が各人で異なる点を問題視した。一方、支援の現場では、同じルールを全員に適用するだけでは、困っている人の個別の必要に十分応えられないことも分かった。制度の公正と具体的なケアをどう両立させるかが議論された。"], "B3": ["大問3　環境と社会の前提", "ある企業は森林を開発し、地域の所得を増やす計画を発表した。これに対して住民からは、動物への影響、土地と水が支える生態系、将来世代の利用可能性など異なる視点が示された。また「森は人間が使うためだけにある」という発想自体を問い直す声もあった。討議の場では、何を価値あるものとみなすかという前提を自覚する必要性が確認された。"], "B4": ["大問4　社会契約と政治の発展", "近代ヨーロッパでは、政治権力の根拠を神からの授権だけでなく人々の同意や権利から説明する議論が進んだ。ある思想家は自然状態における争いから秩序の必要を論じ、別の思想家は政府が人民の権利を侵害したときの抵抗を認めた。さらに共同体に共通する利益と人民の参加を重視する議論も現れた。後の社会では、自由権だけでなく、人間らしい生活を支える権利も重視されるようになった。"], "B5": ["大問5　現代民主政治と公共性", "ある国では、社会保障を手厚くするため行政の専門化が進んだ。他方、財政の持続可能性を理由に市場競争の拡大や行政の縮小を求める意見が現れた。ニュースでは分かりやすい言葉だけを使った主張が拡散し、人々が十分考える前に権威に従うことへの懸念も出ている。公共の問題を論じるときは、多数派の勢いだけでなく根拠に基づく討議が重要だという提案がなされた。"]}, "questions": [{"id": "基礎-01", "section": "基礎", "unit": "E", "kind": "term", "prompt": "「主体性が真理である」を掲げ、自分の生き方を主体的に選ぶことを重視した思想家は誰か。", "answer": "キルケゴール", "why": "選択の不安・絶望を経て、信仰により本来的自己を見いだす思想家。", "options": null, "points": 2, "concept": "主体性", "group": null, "source": "P42-45"}, {"id": "基礎-02", "section": "基礎", "unit": "E", "kind": "term", "prompt": "ニーチェが、既存の価値や人生の意味が失われた状態を表すために用いた概念は何か。", "answer": "ニヒリズム", "why": "虚無主義。価値喪失への対応として新たな価値の創造を考えた。", "options": null, "points": 2, "concept": "ニーチェ", "group": null, "source": "P42-45"}, {"id": "基礎-03", "section": "基礎", "unit": "E", "kind": "term", "prompt": "ヤスパースが重視した、人間が避けることのできない苦悩などの状況を何というか。", "answer": "限界状況", "why": "限界状況を自覚し、有限な自己と超越者の関係を考える。", "options": null, "points": 2, "concept": "ヤスパース", "group": null, "source": "P42-45"}, {"id": "基礎-04", "section": "基礎", "unit": "E", "kind": "term", "prompt": "サルトルの、人間には先天的に決まった生き方がなく、選択を通じて自分を形作ることを示す命題を書け。", "answer": "実存は本質に先立つ", "why": "単に自由があるだけでなく、その選択への責任も意味する。", "options": null, "points": 2, "concept": "サルトル", "group": null, "source": "P42-45"}, {"id": "基礎-05", "section": "基礎", "unit": "E", "kind": "mc", "prompt": "キルケゴールが実存を三段階で説明した順序として正しいものを選べ。", "answer": "A", "why": "享楽の追求、責任の引き受け、神の前の単独者の順。", "options": ["美的実存→倫理的実存→宗教的実存", "宗教的実存→美的実存→倫理的実存", "倫理的実存→宗教的実存→美的実存", "美的実存→宗教的実存→倫理的実存"], "points": 3, "concept": "", "group": null, "source": "P42-45"}, {"id": "基礎-06", "section": "基礎", "unit": "E", "kind": "mc", "prompt": "ニーチェの「超人」の説明として最も適切なのはどれか。", "answer": "B", "why": "力への意志を体現し、新たな価値を創造する。", "options": ["権威ある人物の命令に従う人", "新しい価値を創造して生きる人", "人間の能力を測定・管理する人", "共同体の多数決に必ず従う人"], "points": 3, "concept": "", "group": null, "source": "P42-45"}, {"id": "基礎-07", "section": "基礎", "unit": "E", "kind": "mc", "prompt": "ハイデガーの「世人（ダス・マン）」に最も近い状態はどれか。", "answer": "C", "why": "「みんながそうする」という非本来的な日常的あり方を示す。", "options": ["自分の選択の社会的責任を引き受ける", "信仰により神の前に立つ", "周囲の「普通」に埋没して主体性を失う", "未開社会の思考を再評価する"], "points": 3, "concept": "", "group": null, "source": "P42-45"}, {"id": "基礎-08", "section": "基礎", "unit": "E", "kind": "mc", "prompt": "サルトルの「アンガジュマン」に最も関連する行為はどれか。", "answer": "A", "why": "アンガジュマンは社会参加・政治参加の自覚的な取り組み。", "options": ["自分の行動が社会と関わることを自覚して参加する", "自然資源を将来世代に残す", "国家を最小限に抑える", "有用性だけで知識を判断する"], "points": 3, "concept": "", "group": null, "source": "P42-45"}, {"id": "基礎-09", "section": "基礎", "unit": "E", "kind": "mc", "prompt": "ニーチェの「運命愛」が結びつく概念として適切なのはどれか。", "answer": "B", "why": "繰り返される人生を肯定する運命愛は永劫回帰に対応する。", "options": ["無知のヴェール", "永劫回帰", "権力分立", "妥当性要求"], "points": 3, "concept": "", "group": null, "source": "P42-45"}, {"id": "基礎-10", "section": "基礎", "unit": "E", "kind": "mc", "prompt": "ボーヴォワールの議論に最も関係が深いものを選べ。", "answer": "A", "why": "社会によって作られる性別役割を問い直す。", "options": ["女性の役割が社会的に形成されることへの問題提起", "独占的所有権と最小国家", "議会に対する内閣の責任", "近代的な権力のパノプティコン"], "points": 3, "concept": "", "group": null, "source": "P42-45"}, {"id": "基礎-11", "section": "基礎", "unit": "P", "kind": "term", "prompt": "知識・理論の意味を行動やその結果との関係から考える哲学の潮流を何というか。", "answer": "プラグマティズム", "why": "パース、ジェームズ、デューイが代表。", "options": null, "points": 2, "concept": "プラグマティズム", "group": null, "source": "P46-49"}, {"id": "基礎-12", "section": "基礎", "unit": "P", "kind": "term", "prompt": "デューイが知識を問題解決に用いる道具と捉えた立場を何というか。", "answer": "道具主義", "why": "実用的な探究の中で知識を使う。", "options": null, "points": 2, "concept": "デューイ", "group": null, "source": "P46-49"}, {"id": "基礎-13", "section": "基礎", "unit": "P", "kind": "term", "prompt": "ハーバーマスが述べた、政治・経済の仕組みが日常の人間的関係を侵食することを示す言葉は何か。", "answer": "生活世界の植民地化", "why": "対話的理性による公共性の回復が重視される。", "options": null, "points": 2, "concept": "ハーバーマス", "group": null, "source": "P46-49"}, {"id": "基礎-14", "section": "基礎", "unit": "P", "kind": "term", "prompt": "デリダが従来の二項対立などの前提を問い直すために提唱した手法は何か。", "answer": "脱構築", "why": "対立の優劣や境界の前提に含まれる矛盾を検討する。", "options": null, "points": 2, "concept": "デリダ", "group": null, "source": pt": "次のうち、「世人（ダス・マン）」の説明として最も不適切なものを選べ。", "answer": "C", "why": "ハイデガーは他人と生活すること自体を全面否定していない。日常の匿名的な「ひと」への埋没を分析した。", "options": ["周囲の一般的な判断に従って暮らすあり方", "個人が自分自身の可能性を引き受けない日常的あり方", "誰もが同じ社会の中で過ごすという事実そのものを悪と決めつける立場", "本来的な自己のあり方を見失う状態"], "points": 3, "concept": "", "group": null, "source": "P42-45"}, {"id": "実践-02", "section": "実践", "unit": "E", "kind": "mc", "prompt": "「既成の道徳への批判」「ルサンチマン」「新しい価値の創造」を組み合わせたとき、最も適切な思想家は誰か。", "answer": "B", "why": "ニーチェはルサンチマンに根差す奴隷道徳を批判し、超人による価値創造を重視した。", "options": ["サルトル", "ニーチェ", "ヤスパース", "デューイ"], "points": 3, "concept": "", "group": null, "source": "P42-45"}, {"id": "実践-03", "section": "実践", "unit": "E", "kind": "mc", "prompt": "次の説明の対応として正しいものはどれか。①自分の選択への社会的責任を自覚する。②自己の有限性を限界状況から認識する。", "answer": "A", "why": "アンガジュマン＝サルトル、限界状況＝ヤスパース。", "options": ["①サルトル ②ヤスパース", "①ヤスパース ②サルトル", "①ニーチェ ②ハイデガー", "①キルケゴール ②デューイ"], "points": 3, "concept": "", "group": null, "source": "P42-45"}, {"id": "実践-04", "section": "実践", "unit": "E", "kind": "mc", "prompt": "次の二つの発言の組合せとして正しいものはどれか。甲「人は生まれた時から決まった役割に縛られず、選択によって自己を形作る」。乙「社会的に作られた性別役割を問い直す」。", "answer": "A", "why": "主体的な選択の哲学と性別役割の社会的形成への問題提起を区別する。", "options": ["甲サルトル・乙ボーヴォワール", "甲ボーヴォワール・乙ロールズ", "甲ニーチェ・乙ホッブズ", "甲ハイデガー・乙パース"], "points": 3, "concept": "", "group": null, "source": "P42-45"}, {"id": "実践-05", "section": "実践", "unit": "E", "kind": "term", "prompt": "「自分の意志で選んだつもりでも、生まれた時代・文化・環境は自分で選べない」という人間のあり方を、ハイデガーの用語で何というか。", "answer": "被投性", "why": "選択していない世界に既に投げ込まれているという特徴。", "options": null, "points": 2, "concept": "", "group": null, "source": "P42-45"}, {"id": "実践-06", "section": "実践", "unit": "E", "kind": "write", "prompt": "ハイデガーとサルトルの違いを、「世人」と「自由」の語を用いて60〜100字程度で説明しなさい。", "answer": "ハイデガーは世間の「普通」に埋没する世人のあり方と本来的な生の回復を論じた。サルトルは、人間は自分を自由な選択によって形作り、その結果に責任を負うとした。", "why": "採点観点：世人＝世間への埋没（2点）、自由な選択と責任＝サルトル（3点）。例文と表現が違っても要素があれば正解。", "options": null, "points": 5, "concept": "", "group": null, "source": "P42-45"}, {"id": "実践-07", "section": "実践", "unit": "P", "kind": "mc", "prompt": "「目的を達成する方 oncept": "", "group": null, "source": "P50-53"}, {"id": "実践-14", "section": "実践", "unit": "J", "kind": "mc", "prompt": "次のうち、ノージックの立場から最も強い異議が出そうな制度はどれか。", "answer": "C", "why": "所有権に対して再分配課税を強制することを批判した。", "options": ["不正な窃盗の処罰", "防衛費のための最小限の課税", "本人の同意なく所得を大規模に再分配する課税", "正当な契約に基づく贈与"], "points": 3, "concept": "", "group": null, "source": "P50-53"}, {"id": "実践-15", "section": "実践", "unit": "J", "kind": "mc", "prompt": "「何が正しい分配か」に加え「どんな価値ある共同生活を作るか」を考える思想家は誰か。", "answer": "A", "why": "サンデルは共通善を重視し、ロールズを批判する。", "options": ["サンデル", "ニーチェ", "フーコー", "ジェームズ"], "points": 3, "concept": "", "group": null, "source": "P50-53"}, {"id": "実践-16", "section": "実践", "unit": "J", "kind": "mc", "prompt": "次のうち、第二波フェミニズムの問題意識に最も近い説明はどれか。", "answer": "A", "why": "第二波は形式的な参政権獲得後にも残る日常・構造の不平等に注目。", "options": ["投票権を獲得したあとも家庭・職場の性差別を問い直す", "女性の参政権のみを唯一の問題とする", "自然状態の戦争を避けるため権利を譲る", "動物実験の3Rを徹底する"], "points": 3, "concept": "", "group": null, "source": "P50-53"}, {"id": "実践-17", "section": "実践", "unit": "J", "kind": "term", "prompt": "「国家は人々それぞれの善い生き方を公平に認めるべきだ」というロールズの考えを、プリントの用語で答えなさい。", "answer": "善に対する正の優越", "why": "唯一の善の押しつけではなく正しい制度を優先する。", "options": null, "points": 2, "concept": "", "group": null, "source": "P50-53"}, {"id": "実践-18", "section": "実践", "unit": "J", "kind": "write", "prompt": "ロールズの「格差原理」とノージックの「所有権」を用い、所得再分配について両者の立場の違いを説明しなさい。", "answer": "ロールズは格差原理により、最も不利な人々の利益になるような制度的不平等を認める。ノージックは正当に獲得・移転された所有権を重視し、強制的な所得再分配を批判する。", "why": "採点観点：ロールズの格差原理（2点）、ノージックの所有権・課税批判（3点）。", "options": null, "points": 5, "concept": "", "group": null, "source": "P50-53"}, {"id": "実践-19", "section": "実践", "unit": "B", "kind": "mc", "prompt": "次のうち、本人の自己決定を尊重する仕組みの例として最も適切なのはどれか。", "answer": "A", "why": "リヴィング・ウィルは本人の意思をあらかじめ示すもの。", "options": ["本人の希望を事前に文書化しておく", "医療者だけで本人の希望を推測し決める", "家族の希望を常に本人より優先する", "経済性だけで一律に判断する"], "points": 3, "concept": "", "group": null, "source": "P54-57"}, {"id": "実践-20", "section": "実践", "unit": "B", "kind": "mc", "prompt": "次の説明のうち誤っているものを選べ。", "answer": "D", up": null, "source": "P58-60"}, {"id": "実践-27", "section": "実践", "unit": "N", "kind": "mc", "prompt": "次の人物と思想の組合せのうち誤っているものはどれか。", "answer": "D", "why": "無知のヴェールはロールズ。レオポルドは土地倫理。", "options": ["カーソン―沈黙の春", "シンガー―動物の利益への配慮", "ヨナス―未来世代への責任", "レオポルド―無知のヴェール"], "points": 3, "concept": "", "group": null, "source": "P58-60"}, {"id": "実践-28", "section": "実践", "unit": "N", "kind": "mc", "prompt": "環境に配慮した消費行動の説明で、「フェアトレード」に特に近いのはどれか。", "answer": "A", "why": "生産者の公正な取引条件を重視する点が特徴。", "options": ["生産者に公正な対価が支払われる取引に配慮する", "未来の自然環境を国家だけの責任とする", "動物実験を無条件に義務付ける", "政治権力を立法・行政・司法へ分ける"], "points": 3, "concept": "", "group": null, "source": "P58-60"}, {"id": "実践-29", "section": "実践", "unit": "N", "kind": "term", "prompt": "自然の側にも生命それ自体の価値があるとし、環境保護自体を目的とする思想的潮流を何というか。", "answer": "ディープ・エコロジー", "why": "アルネ＝ネスの提唱した人間中心主義への批判。", "options": null, "points": 2, "concept": "", "group": null, "source": "P58-60"}, {"id": "実践-30", "section": "実践", "unit": "N", "kind": "write", "prompt": "レオポルドの土地倫理とヨナスの世代間倫理は何が違うか、「対象」という語を使って説明しなさい。", "answer": "土地倫理が重視する対象は土壌・水・動植物などの生態系共同体である。一方、世代間倫理が重視する対象は、現在の行動によって影響を受ける未来の世代である。", "why": "採点観点：土地倫理＝生態系共同体（2点）、世代間倫理＝未来世代（3点）。", "options": null, "points": 5, "concept": "", "group": null, "source": "P58-60"}, {"id": "実践-31", "section": "実践", "unit": "C", "kind": "mc", "prompt": "次の社会契約説の組合せで正しいものはどれか。", "answer": "A", "why": "同じ社会契約説でも、想定する自然状態と制度が異なる。", "options": ["ホッブズ＝自然状態は争い、ロック＝抵抗権、ルソー＝一般意思", "ホッブズ＝一般意思、ロック＝超人、ルソー＝ケイパビリティ", "ホッブズ＝所有権の正義、ロック＝世人、ルソー＝道具主義", "ホッブズ＝規律権力、ロック＝共同体の物語、ルソー＝終末期医療"], "points": 3, "concept": "", "group": null, "source": "P62-65"}, {"id": "実践-32", "section": "実践", "unit": "C", "kind": "mc", "prompt": "「法治主義」と「法の支配」の違いを示すものとして最も適切なのはどれか。", "answer": "A", "why": "プリントでは19世紀ドイツ型の形式的な法治主義と法の支配を区別。", "options": ["法治主義は法の形式、法の支配は人権を守る法の内容も重視する", "法治主義は議会廃止、法の支配は議会不要を意味する", "法治主義は法律を禁止し、法の支配は道徳だけを重視する", "両者の意味はあらゆる時代において常に一致する"], "points": 3, "concept": "", "group": null, "source": "P62-65"}, {"id": "実践-33", "section": "実践", "unit": "C", "kind": "mc", "prompt": "議会が行政府を監視し、裁判所が法律の適合性を審査することで権力の濫用を防ごうとしている。この制度の基礎に最も近いのはどれか。", "answer": "A", "why": "立法・行政・司法を分離して抑制・均衡を働かせる。", "options": ["モンテスキューの権力分立", "ニーチェの永劫回帰", "センのケイパビリティ", "ギリガンのケアの倫理"], "points": 3, "concept": "", "group": null, "source": "P62-65"}, {"id": "実践-34", "section": "実践", "unit": "C", "kind": "mc", "prompt": "「誰にも神が授けた王権がある」という説を批判する文脈で用いられたものはどれか。", "answer": "A", "why": "政治権力は王権神授説ではなく人々の権利と合意を根拠にする。", "options": ["社会契約説", "奴隷道徳", "野生の思考", "エシカル消費"], "points": 3, "concept": "", "group": null, "source": "P62-65"}, {"id": "実践-35", "section": "実践", "unit": "C", "kind": "term", "prompt": "議会が作った通常の法律より上位にあり、国家権力を拘束する規範を何というか。", "answer": "高次の法", "why": "憲法を通常の法律より上位の根本法として捉える考えと関連。", "options": null, "points": 2, "concept": "", "group": null, "source": "P62-65"}, {"id": "実践-36", "section": "実践", "unit": "C", "kind": "write", "prompt": "ホッブズとロックの違いを、自然状態と人民の権利の扱いに触れて説明しなさい。", "answer": "ホッブズは自然状態を争いの状態と見て、安全のため自然権を国家に譲渡するとした。ロックは自然権の保障のため国家を設け、侵害する政府に抵抗する権利を認めた。", "why": "採点観点：ホッブズの自然状態・譲渡（2点）、ロックの信託・抵抗権（3点）。", "options": null, "points": 5, "concept": "", "group": null, "source": "P62-65"}, {"id": "実践-37", "section": "実践", "unit": "D", "kind": "mc", "prompt": "次の政策と国のタイプを最も適切に結びつけたものはどれか。", "answer": "A", "why": "福祉国家は貧困や失業への支援を含めて政府の役割が広い。", "options": ["社会保障・景気対策の拡充＝福祉国家", "国防と司法以外への関与を最小限にする＝福祉国家", "国民が直接投票する＝必ず大統領制", "議会に責任を負う内閣＝権威主義体制"], "points": 3, "concept": "", "group": null, "source": "P66-71"}, {"id": "実践-38", "section": "実践", "unit": "D", "kind": "mc", "prompt": "次のうち、議院内閣制と大統領制を区別する説明として適切なのはどれか。", "answer": "A", "why": "内閣と議会の信任関係が議院内閣制の中心。", "options": ["議院内閣制は内閣の議会への信任を基盤とする", "議院内閣制では選挙が禁止される", "大統領制では裁判所が必ず不要となる", "大統領制には立法権が存在しない"], "points": 3, "concept": "", "group": null, "source": "P66-71"}, {"id": "実践-39", "section": "実践", "unit": "D", "kind": "mc", "prompt": "「大衆社会で自由に不安を感じた人々が、強い権威に従おうとすることがある」と分析した人物は誰か。", "answer": "A", "why": "『自由からの逃走』が関連する。", "options": ["フロム", "ロールズ", "シンガー", "パース"], "points": 3, "concept": "", "group": null, "source": "P66-71"}, {"id": "実践-40", "section": "実践", "unit": "D", "kind": "mc", "prompt": "新自由主義への移行を説明するものとして最も適切なのはどれか。", "answer": "A", "why": "配布プリントでは「大きな政府」から「小さな政府」への議論として説明。", "options": ["福祉国家の財政・効率上の課題から市場競争を重視する考え方が強まった", "福祉国家の成功により市場が完全に消滅した", "直接民主政への移行が全国家で義務づけられた", "憲法が不要となった"], "points": 3, "concept": "", "group": null, "source": "P66-71"}, {"id": "実践-41", "section": "実践", "unit": "D", "kind": "term", "prompt": "政府に人間らしい生活の条件や保障を求める権利を総称して何というか。", "answer": "社会権", "why": "「国家による自由」と表現され、ワイマール憲法と関連する。", "options": null, "points": 2, "concept": "", "group": null, "source": "P66-71"}, {"id": "実践-42", "section": "実践", "unit": "D", "kind": "write", "prompt": "「夜警国家」と「福祉国家」の違いを、それぞれ国家が果たす役割に触れて説明しなさい。", "answer": "夜警国家は治安・司法・国防などに国家の役割を限ろうとする。福祉国家は社会保障や景気対策などに積極的に関わり、社会的・経済的な生活条件を整える。", "why": "採点観点：夜警国家の最小限の役割（2点）、福祉国家の積極的な保障（3点）。", "options": null, "points": 5, "concept": "", "group": null, "source": "P66-71"}, {"id": "模試A-01", "section": "模試A", "unit": "E", "kind": "mc", "prompt": "「周囲に合わせることで本来的な自己のあり方を見失う」という説明に最も近い思想家を選べ。", "answer": "C", "why": "ハイデガーは世人（ダス・マン）として生きる非本来的あり方を分析した。", "options": ["キルケゴール", "ニーチェ", "ハイデガー", "ロールズ"], "points": 4, "concept": "", "group": "A1", "source": "P42-45"}, {"id": "模試A-02", "section": "模試A", "unit": "E", "kind": "mc", "prompt": "乙の発言の思想的根拠として最も適切なのはどれか。", "answer": "A", "why": "「実存は本質に先立つ」はサルトル。人は自分の自由な選択に責任を負う。", "options": ["実存は本質に先立つ", "無知のヴェール", "善に対する正の優越", "人権宣言"], "points": 4, "concept": "", "group": "A1", "source": "P42-45"}, {"id": "模試A-03", "section": "模試A", "unit": "E", "kind": "mc", "prompt": "丙の発言に最も近い組合せを選べ。", "answer": "B", "why": "価値の喪失とその再創造を論じるニーチェに対応する。", "options": ["ヤスパース―限界状況", "ニーチェ―ニヒリズムと超人", "セン―ケイパビリティ", "ロック―抵抗権"], "points": 4, "concept": "", "group": "A1", "source": "P42-45"}, {"id": "模試A-04", "section": "模試A", "unit": "E", "kind": "term", "prompt": "自己の有限性や他者との関係に目覚める契機として、ヤスパースが論じた避けがたい状況を何というか。", "answer": "限界状況", "why": "死・苦悩・闘争・罪責などが例に挙げられる。", "options": null, "points": 4, "concept": "", "group": "A1", "source": "P42-45"}, {"id": "模試A-05", "section": "模試A", "unit": "E", "kind": "mc", "prompt": "キルケゴールの思想について正しいものを選べ。", "answer": "D", "why": "美的・倫理的・宗教的実存を区別し、神の前の単独者を重視した。", "options": ["既存価値の再評価だけを目的とした", "国家による財産再分配を論じた", "知識を生活の道具だとした", "美的・倫理的・宗教的実存の三段階を論じた"], "points": 4, "concept": "", "group": "A1", "source": "P42-45"}, {"id": "模試A-06", "section": "模試A", "unit": "P", "kind": "mc", "prompt": "管理者が「平均点を最も効率的に上げる方法」だけを追う姿勢として近いものはどれか。", "answer": "B", "why": "目標に対する手段の効率を優先するものは道具的理性。", "options": ["対話的理性", "道具的理性", "世代間倫理", "宗教的実存"], "points": 4, "concept": "", "group": "A2", "source": "P46-49"}, {"id": "模試A-07", "section": "模試A", "unit": "P", "kind": "mc", "prompt": "「平均点の上昇だけを目標にすることは本当に正しいのか」と問う立場に関係が深いのはどれか。", "answer": "C", "why": "目的それ自体を吟味する批判的理性。", "options": ["移転の正義", "永劫回帰", "批判的理性", "人民主権"], "points": 4, "concept": "", "group": "A2", "source": "P46-49"}, {"id": "模試A-08", "section": "模試A", "unit": "P", "kind": "mc", "prompt": "「多数決だけでなく根拠を確認し合い合意をめざす」立場に最も近い人物は誰か。", "answer": "A", "why": "ハーバーマスの対話的理性・コミュニケーション的行為。", "options": ["ハーバーマス", "カーソン", "ホッブズ", "ノージック"], "points": 4, "concept": "", "group": "A2", "source": "P46-49"}, {"id": "模試A-09", "section": "模試A", "unit": "P", "kind": "term", "prompt": "対話で互いの主張に納得できないとき、その根拠を確かめることに関連するハーバーマスの用語を答えよ。", "answer": "妥当性要求", "why": "議論の主張には確認可能な根拠が必要だと考える。", "options": null, "points": 4, "concept": "", "group": "A2", "source": "P46-49"}, {"id": "模試A-10", "section": "模試A", "unit": "P", "kind": "write", "prompt": "デューイの立場から授業を改善するとしたら、どのような学習活動が考えられるか。「探究」と「結果」を用いて50〜100字で答えよ。", "answer": "生徒が自ら課題を設定して探究し、仮説を試す学習活動を行う。行為の結果を振り返って知識を使い、授業や学習方法を改善していく。", "why": "採点観点：自分で課題設定・探究（2点）、実際の結果に基づく検証・改善（2点）。", "options": null, "points": 4, "concept": "", "group": "A2", "source": "P46-49"}, {"id": "模試A-11", "section": "模試A", "unit": "J", "kind": "mc", "prompt": "次の文章の空欄〔甲〕〔乙〕を埋める組合せを選べ。「自分の財産や能力などを知らない〔甲〕の下で、人々は自分にだけ有利な条件を押し通しにくくなり、すべての人に〔乙〕を保障する原理を考える。」", "answer": "D", "why": "甲はロールズの原初状態であり、第一原理ではすべての人への平等な基本的自由を保障する。", "options": ["甲＝現存在／乙＝所有権の絶対不可侵", "甲＝自然状態／乙＝奴隷道徳", "甲＝限界状況／乙＝宗教的実存", "甲＝原初状態／乙＝平等な基本的自由"], "points": 4, "concept": "", "group": "A3", "source": "P50-53"}, {"id": "模試A-12", "section": "模試A", "unit": "J", "kind": "mc", "prompt": "「正当な取得や贈与による財産の移動を重視する」委員の立場に近い人物は誰か。", "answer": "C", "why": "ノージックは獲得・移転の正義に基づく権原を重視する。", "options": ["ロールズ", "マッキンタイア", "ノージック", "デューイ"], "points": 4, "concept": "", "group": "A3", "source": "P50-53"}, {"id": "模試A-13", "section": "模試A", "unit": "J", "kind": "mc", "prompt": "学校共同体にとっての価値と善い生活に注目する立場はどれか。", "answer": "A", "why": "共同体主義（コミュニタリアニズム）は共通善の意義を考える。", "options": ["コミュニタリアニズム", "リバタリアニズム", "構造言語学", "実存主義"], "points": 4, "concept": "", "group": "A3", "source": "P50-53"}, {"id": "模試A-14", "section": "模試A", "unit": "J", "kind": "term", "prompt": "委員たちが自分の財産・能力・信条などを知らないという仮説的な状況をロールズは何と呼ぶか。", "answer": "原初状態", "why": "無知のヴェールのもとで正義の原理を選ぶ状況。", "options": null, "points": 4, "concept": "", "group": "A3", "source": "P50-53"}, {"id": "模試A-15", "section": "模試A", "unit": "J", "kind": "mc", "prompt": "「同じお金を配っても、それを使って実際に何ができるかは異なる」という批判に関係するのはどれか。", "answer": "B", "why": "センのケイパビリティは価値ある生活を選ぶ実質的な自由を示す。", "options": ["格差原理だけを重視する立場", "センのケイパビリティ", "ノージックの移転の正義", "ハイデガーの現存在"], "points": 4, "concept": "", "group": "A3", "source": "P50-53"}, {"id": "模試A-16", "section": "模試A", "unit": "B", "kind": "mc", "prompt": "次の説明Ⅰ・Ⅱの正誤の組合せとして正しいものを選べ。Ⅰ「ES細胞は胚に由来する。」Ⅱ「iPS細胞は体細胞を初期化するなどして作られる。」", "answer": "A", "why": "両方とも正しい。ESとiPSは細胞の由来・作製方法が異なる。", "options": ["Ⅰ正・Ⅱ正", "Ⅰ正・Ⅱ誤", "Ⅰ誤・Ⅱ正", "Ⅰ誤・Ⅱ誤"], "points": 4, "concept": "", "group": "A4", "source": "P54-57"}, {"id": "模試A-17", "section": "模試A", "unit": "B", "kind": "mc", "prompt": "治療の選択について本人の意志を事前に記録し尊重する仕組みに近いのはどれか。", "answer": "C", "why": "リヴィング・ウィルは本人の希望をあらかじめ文書で示すもの。", "options": ["移転の正義", "自然的自由", "リヴィング・ウィル", "議院内閣制"], "points": 4, "concept": "", "group": "A4", "source": "P54-57"}, {"id": "模試A-18", "section": "模試A", "unit": "N", "kind": "mc", "prompt": "「土地・水・動物・植物などが構成する共同体の安定」を重視した思想家は誰か。", "answer": "D", "why": "レオポルドの土地倫理が対応する。", "options": ["ヨナス", "シンガー", "カーソン", "レオポルド"], "points": 4, "concept": "", "group": "A4", "source": "P58-60"}, {"id": "模試A-19", "section": "模試A", "unit": "N", "kind": "term", "prompt": "現在の世代が未来の世代に対して環境上の責任を負うという考え方を何というか。", "answer": "世代間倫理", "why": "ヨナスに関連し、持続可能な開発を考える根拠となる。", "options": null, "points": 4, "concept": "", "group": "A4", "source": "P58-60"}, {"id": "模試A-20", "section": "模試A", "unit": "B", "kind": "write", "prompt": "個人の「自己決定権」を尊重するだけでは生命倫理の判断が難しい場合がある。なぜか、具体的な関係者を挙げて説明せよ。", "answer": "生殖補助医療などでは本人の選択に加え、生まれる子や医療を受ける人、関係する人々の権利・健康・尊厳も関係するため、本人の自己決定だけでは結論を出せない場合がある。", "why": "採点観点：本人以外の関係者（2点）、権利や健康など別の利益との調整（2点）。", "options": null, "points": 4, "concept": "", "group": "A4", "source": "P54-57"}, {"id": "模試A-21", "section": "模試A", "unit": "C", "kind": "mc", "prompt": "次の人物と思想の対応のうち、誤っているものを選べ。", "answer": "B", "why": "抵抗権はロック。ホッブズは自然状態の争いと自然権の譲渡を重視する。", "options": ["ホッブズ―自然状態の争い", "ホッブズ―抵抗権・革命権", "ロック―自然権の信託", "ルソー―一般意思"], "points": 4, "concept": "", "group": "A5", "source": "P62-65"}, {"id": "模試A-22", "section": "模試A", "unit": "C", "kind": "mc", "prompt": "憲法により権力を制限し、個人の権利を守ろうとする考えを何というか。", "answer": "A", "why": "立憲主義は政治権力の濫用から人々を守る考え。", "options": ["立憲主義", "ポピュリズム", "道具主義", "奴隷道徳"], "points": 4, "concept": "", "group": "A5", "source": "P62-65"}, {"id": "模試A-23", "section": "模試A", "unit": "D", "kind": "mc", "prompt": "内閣が議会の信任に基づき、議会に責任を負う制度として適切なのはどれか。", "answer": "D", "why": "議院内閣制の定義。", "options": ["直接民主政", "民主集中制", "権威主義体制", "議院内閣制"], "points": 4, "concept": "", "group": "A5", "source": "P66-71"}, {"id": "模試A-24", "section": "模試A", "unit": "D", "kind": "term", "prompt": "国家に人間らしい生活の条件を積極的に求める権利を、自由権と対比して何と呼ぶか。", "answer": "社会権", "why": "ワイマール憲法の規定が歴史的な例。", "options": null, "points": 4, "concept": "", "group": "A5", "source": "P66-71"}, {"id": "模試A-25", "section": "模試A", "unit": "D", "kind": "write", "prompt": "夜警国家と福祉国家では、どのように国家の役割が異なるか説明しなさい。", "answer": "夜警国家は国防・治安・司法などに活動を絞る。福祉国家は社会保障、景気対策、格差是正など国民生活の保障にも積極的に関与する。", "why": "採点観点：夜警国家の役割の限定（2点）、福祉国家の積極的機能（2点）。", "options": null, "points": 4, "concept": "", "group": "A5", "source": "P66-71"}, {"id": "模試B-01", "section": "模試B", "unit": "E", "kind": "mc", "prompt": "Aの発言と特に近い哲学者を選べ。", "answer": "A", "why": "選択の不安と主体的な生き方という問題意識はキルケゴール。", "options": ["キルケゴール", "ノージック", "レオポルド", "ロック"], "points": 4, "concept": "", "group": "B1", "source": "P42-45"}, {"id": "模試B-02", "section": "模試B", "unit": "P", "kind": "mc", "prompt": "Bの発言と最も密接な組合せはどれか。", "answer": "C", "why": "ホルクハイマー・アドルノの批判的理性は目的そのものを吟味する。", "options": ["デューイ―道具主義", "ニーチェ―超人", "ホルクハイマー・アドルノ―批判的理性", "セン―ケイパビリティ"], "points": 4, "concept": "", "group": "B1", "source": "P46-49"}, {"id": "模試B-03", "section": "模試B", "unit": "P", "kind": "mc", "prompt": "Cの考え方に近いのはどれか。", "answer": "D", "why": "ハーバーマスの対話的理性は理由に基づく対話と合意形成を重視。", "options": ["所有権の絶対不可侵", "宗教的実存", "権原", "対話的理性"], "points": 4, "concept": "", "group": "B1", "source": "P46-49"}, {"id": "模試B-04", "section": "模試B", "unit": "E", "kind": "term", "prompt": "周りの誰でもよい「ひと」と同じように生きて本来的な自己を見失うあり方を、ハイデガーの語で答えなさい。", "answer": "世人", "why": "ダス・マンとも呼ばれる。", "options": null, "points": 4, "concept": "", "group": "B1", "source": "P42-45"}, {"id": "模試B-05", "section": "模試B", "unit": "P", "kind": "mc", "prompt": "次の組合せのうち、誤っているものを選べ。", "answer": "B", "why": "フーコー＝エピステーメー・生権力。プラグマティズムはパース、ジェームズ、デューイ。", "options": ["フーコー―生権力", "フーコー―無知のヴェール", "レヴィ＝ストロース―野生の思考", "デリダ―脱構築"], "points": 4, "concept": "", "group": "B1", "source": "P46-49"}, {"id": "模試B-06", "section": "模試B", "unit": "J", "kind": "mc", "prompt": "学習機会に関する次のⅠ・Ⅱの正誤組合せを選べ。Ⅰ「全員に同額を配れば、実際に選べる学習機会も必ず同じになる。」Ⅱ「センは、その人が実際に何を実現できるかという自由を重視した。」", "answer": "A", "why": "同額支給でも環境や条件によって実際の機会は異なり得る。センのケイパビリティを理解する。", "options": ["Ⅰ誤・Ⅱ正", "Ⅰ正・Ⅱ誤", "Ⅰ正・Ⅱ正", "Ⅰ誤・Ⅱ誤"], "points": 4, "concept": "", "group": "B2", "source": "P50-53"}, {"id": "模試B-07", "section": "模試B", "unit": "B", "kind": "mc", "prompt": "「同じ一般的ルールでも、目の前の人の状態によって必要な支援は異なる」と考える立場はどれか。", "answer": "D", "why": "ギリガンらのケアの倫理が具体的な他者との関係を重視。", "options": ["最小国家", "永劫回帰", "奴隷道徳", "ケアの倫理"], "points": 4, "concept": "", "group": "B2", "source": "P54-57"}, {"id": "模試B-08", "section": "模試B", "unit": "J", "kind": "mc", "prompt": "「公正な社会であれば所得格差は無条件で認められる」という主張の問題点として適切なのはどれか。", "answer": "B", "why": "ロールズは不利な人への利益や公正な機会などの条件を求めた。", "options": ["ロールズは格差をまったく論じなかった", "ロールズは格差を認める条件を設けている", "ロールズは最低限の国家さえ認めなかった", "ロールズは実存の三段階を提唱した"], "points": 4, "concept": "", "group": "B2", "source": "P50-53"}, {"id": "模試B-09", "section": "模試B", "unit": "B", "kind": "term", "prompt": "患者が自分の意思を前もって文書で示すものを何というか。", "answer": "リヴィング・ウィル", "why": "生命倫理で自己決定権と関わる。", "options": null, "points": 4, "concept": "", "group": "B2", "source": "P54-57"}, {"id": "模試B-10", "section": "模試B", "unit": "B", "kind": "write", "prompt": "「普遍的なルール」と「具体的な関係への配慮」という語を用いて、正義の倫理とケアの倫理の違いを説明せよ。", "answer": "正義の倫理は普遍的なルールや権利に基づく判断を重視する。ケアの倫理は目の前の人との具体的な関係や必要への配慮を重視する。", "why": "採点観点：正義の倫理＝普遍的ルール（2点）、ケアの倫理＝具体的関係と配慮（2点）。", "options": null, "points": 4, "concept": "", "group": "B2", "source": "P54-57"}, {"id": "模試B-11", "section": "模試B", "unit": "N", "kind": "mc", "prompt": "動物が苦痛を感じることへの配慮を最も直接的に論じる人物は誰か。", "answer": "D", "why": "シンガーは動物の利益や苦痛の倫理的考慮を論じた。", "options": ["カーソン", "ヨナス", "セン", "シンガー"], "points": 4, "concept": "", "group": "B3", "source": "P58-60"}, {"id": "模試B-12", "section": "模試B", "unit": "N", "kind": "mc", "prompt": "開発による将来世代への影響を重視する考え方はどれか。", "answer": "B", "why": "世代間倫理。未来世代を考える点が特徴。", "options": ["所有権", "世代間倫理", "アンガジュマン", "批判的理性"], "points": 4, "concept": "", "group": "B3", "source": "P58-60"}, {"id": "模試B-13", "section": "模試B", "unit": "N", "kind": "mc", "prompt": "「土地それ自体も共同体であり、その健全さを守ろう」という発想の思想家は誰か。", "answer": "A", "why": "レオポルドが土地倫理で生態系共同体を重視。", "options": ["レオポルド", "ノージック", "ハイデガー", "ジェームズ"], "points": 4, "concept": "", "group": "B3", "source": "P58-60"}, {"id": "模試B-14", "section": "模試B", "unit": "N", "kind": "term", "prompt": "生命の固有の価値を重視し、人間の利益のためだけでない環境保護を主張する思想運動を何というか。", "answer": "ディープ・エコロジー", "why": "アルネ＝ネスの名と結びつけて覚える。", "options": null, "points": 4, "concept": "", "group": "B3", "source": "P58-60"}, {"id": "模試B-15", "section": "模試B", "unit": "N", "kind": "mc", "prompt": "環境保全に関する次の記述のうち、不適切なものはどれか。", "answer": "C", "why": "「現在だけ」でなく将来の需要を考えることが持続可能な開発に必要。", "options": ["エシカル消費は社会や環境への影響を考えて選ぶ", "フェアトレードは生産者の取引条件に配慮する", "持続可能な開発は未来世代の必要を全く考慮しない", "カーソンは『沈黙の春』で汚染を警告した"], "points": 4, "concept": "", "group": "B3", "source": "P58-60"}, {"id": "模試B-16", "section": "模試B", "unit": "C", "kind": "mc", "prompt": "自然状態を万人の争いとして捉えた人物は誰か。", "answer": "B", "why": "『リヴァイアサン』を書いたホッブズ。", "options": ["ロック", "ホッブズ", "ルソー", "モンテスキュー"], "points": 4, "concept": "", "group": "B4", "source": "P62-65"}, {"id": "模試B-17", "section": "模試B", "unit": "C", "kind": "mc", "prompt": "政府が自然権を侵害した場合に抵抗できると論じた人物は誰か。", "answer": "C", "why": "ロックの抵抗権・革命権。", "options": ["ホッブズ", "フーコー", "ロック", "サンデル"], "points": 4, "concept": "", "group": "B4", "source": "P62-65"}, {"id": "模試B-18", "section": "模試B", "unit": "C", "kind": "mc", "prompt": "共通の利益をめざす一般意思、人民の直接的な政治参加に近い思想家は誰か。", "answer": "A", "why": "ルソーは一般意思と直接民主政の思想に関係する。", "options": ["ルソー", "ホッブズ", "デューイ", "ヨナス"], "points": 4, "concept": "", "group": "B4", "source": "P62-65"}, {"id": "模試B-19", "section": "模試B", "unit": "C", "kind": "term", "prompt": "議会・政府・裁判所などを相互に抑制させて権力の濫用を防ごうとする原則は何か。", "answer": "権力分立", "why": "三権分立とも呼ぶ。モンテスキューと関連。", "options": null, "points": 4, "concept": "", "group": "B4", "source": "P62-65"}, {"id": "模試B-20", "section": "模試B", "unit": "D", "kind": "write", "prompt": "自由権と社会権は何を国家に求める点で違うか、「干渉」「生活保障」の2語を使って説明せよ。", "answer": "自由権は国家からの不当な干渉を受けずに自由を行使する権利であり、社会権は人間らしい生活を送るため国家に生活保障を求める権利である。", "why": "採点観点：自由権＝不当な干渉からの自由（2点）、社会権＝生活保障（2点）。", "options": null, "points": 4, "concept": "", "group": "B4", "source": "P66-71"}, {"id": "模試B-21", "section": "模試B", "unit": "D", "kind": "mc", "prompt": "次の記述Ⅰ・Ⅱの組合せとして正しいものを選べ。Ⅰ「福祉国家の行政分野が拡大すると、行政国家と呼ばれる特徴が強まる。」Ⅱ「行政国家では政府の政策分野が国防・治安だけに限定される。」", "answer": function esc(text){return String(text??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');}
function norm(text){return String(text??'').normalize('NFKC').toLowerCase().replace(/[ 　\s・\.。=＝\-―ー～〜「」『』（）()\[\],，、:/／\/]/g,'');}
const ALIASES={'抵抗権':['革命権'],'権力分立':['三権分立'],'リヴィング・ウィル':['リビングウィル','リヴィングウィル'],'iPS細胞':['人工多能性幹細胞'],'ケイパビリティ':['潜在能力'],'世人':['ダスマン','ダス・マン'],'ディープ・エコロジー':['ディープエコロジー運動'],'宇宙船地球号':['宇宙船倫理']};
function isCorrectTerm(q,entered){const val=norm(entered); if(!val)return false;let values=[q.answer,...(ALIASES[q.answer]||[])];return values.some(x=>norm(x)===val);}

function updateNav(){ document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));const sel=$('#unitSel');sel.innerHTML='<option value="all">全7分野</option>'+Object.entries(DATA.units).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('');sel.value=state.unit; const pr=countProgress('基礎'),ap=countProgress('実践');$('#progressBasic').textContent=`${pr.done}/${pr.all} 解答済み`;$('#progressApplied').textContent=`${ap.done}/${ap.all} 解答済み`;$('#progressBar').style.setProperty('--pw',`${(pr.done+ap.done)/112*100}%`);$('#modeBrief').textContent=state.mode.startsWith('模試')?'模試は解答をすべて提出するまで正答を表示しません。':'一問ずつ答え、解説を読んで次に進みます。';$('#filterWrap').classList.toggle('invis',state.mode.startsWith('模試'));$('#studyFilter').value=state.filter; }

  state.studyIndex=Math.max(0,Math.min(state.studyIndex,arr.length-1));const q=arr[state.studyIndex];const info=historyMap[q.id];const n=state.studyIndex+1;
  let input=q.kind==='mc'?optionHtml(q):q.kind==='term'?'<label class="label" for="termAnswer">解答（用語・思想家名）</label><input id="termAnswer" class="input-answer" type="text" autocomplete="off" placeholder="答えを入力">':'<label class="label" for="longAnswer">自分の言葉で説明する</label><textarea id="longAnswer" class="input-answer textarea" placeholder="理由と違いを説明"></textarea>';
  main.innerHTML=`<div class="headline">${esc(state.mode)} / ${esc(studyUnitLabel(q.unit))}</div><h1 class="hero-title">${esc(state.mode==='復習'?'間違えた問題の復習':'問題演習')}</h1><div class="subhead"><span class="pill">${esc(q.id)}</span><span class="pill">${n} / ${arr.length} 問</span><span class="pill">${q.kind==='mc'?'4択':q.kind==='term'?'短答':'記述'}</span></div><div class="progress-track"><div class="progress-fill" style="width:${Math.floor(n/arr.length*100)}%"></div></div><div class="q-title">${esc(q.prompt)}</div><div id="inputArea">${input}</div><div id="feedbackArea"></div><div class="actions"><button class="btn" onclick="prevStudy()">← 前の問題</button><button class="btn primary" id="studySubmit" onclick="studySubmit()">採点・解説を表示</button><button class="btn" onclick="nextStudy()">次の問題 →</button></div><div class="notice" style="margin-top:17px">${esc(q.source)}｜解答と解説を見た後、理解度を記録できます。${info?' 前回：'+(info.good?'正解':'要復習'):''}</div>`;
  if(q.kind==='mc'){$$('#inputArea .choice').forEach(btn=>btn.addEventListener('click',()=>{state.selected=btn.dataset.choice;$$('#inputArea .choice').forEach(x=>x.classList.toggle('selected',x===btn));}));}

function studySubmit(isRestore=false){const arr=itemsForStudy(),q=arr[state.studyIndex];if(!q)return;state.show=true;const letter=state.selected;let chosen='',isGood=false;
  if(q.kind==='mc'){chosen=letter;isGood=letter===q.answer;}else{chosen=(q.kind==='term'?$('#termAnswer')?.value:$('#longAnswer')?.value)||state.typed;state.typed=chosen;isGood=q.kind==='term' && isCorrectTerm(q,chosen);}
  const answer=q.kind==='mc'?`${q.answer}．${esc(q.options['ABCD'.indexOf(q.answer)])}`:esc(q.answer);
  const theme=isGood?'ok':q.kind==='mc'&&chosen?'ng':'';
  const label=q.kind==='write'?'模範解答の一例':!chosen?'未回答：正答を確認しましょう':isGood?'正解':'正解を確認';
  $('#feedbackArea').innerHTML=`<div class="feedback ${theme}"><div class="answer-title">${label}</div><b>${answer}</b><p>${esc(q.why)}</p>${q.kind==='term'?`<p class="mini muted">${chosen?'入力：'+esc(chosen):'未入力'}（表記の違いは自動判定しきれない場合があります）</p>`:''}<div class="divider"></div><div class="mini muted">説明できたかを自分で判断して記録してください。</div><div class="actions"><button class="btn primary" onclick="markStudy(true)">理解できた ✓</button><button class="btn" onclick="markStudy(false)">要復習 ×</button></div></div>`;
  if(q.kind==='mc'){$$('#inputArea .choice').forEach(btn=>{btn.classList.toggle('correct',btn.dataset.choice===q.answer);btn.classList.toggle('wrong',btn.dataset.choice===letter && letter!==q.answer);btn.classList.toggle('selected',btn.dataset.choice===letter);});}
  if(!isRestore && (q.kind==='mc'||q.kind==='term'))record(q,isGood);
}

function renderExam(main){const section=state.mode,arr=DATA.questions.filter(x=>x.section===section);if(!state.exam){main.innerHTML=`<div class="headline">${esc(section)} / 25問・100点</div><h1 class="hero-title">本番形式の模擬試験</h1><div class="intro-step"><strong>50分・100点・25問</strong><p>解答を提出するまでは正解と解説は表示しません。長文を読んでから設問に答えてください。記述3問は自己採点です。</p><p class="muted mini">紙で解きたい場合は同梱の模擬試験PDFを使ってください。</p></div><div class="statgrid"><div class="statbox"><b>25</b><span class="mini">設問数</span></div><div class="statbox"><b>50分</b><span class="mini">試験時間</span></div></div><div class="actions"><button class="btn primary full" onclick="startExam()">試験を開始する</button></div>`;return;}

function startTick(){if(state.examTimer)clearInterval(state.examTimer);state.examTimer=setInterval(updateTimer,1000);}
function submitExam(expired=false){if(!state.exam||state.exam.finished)return;if(!expired && !confirm('回答を提出し、正解と解説を表示しますか？'))return;state.exam.finished=true;clearInterval(state.examTimer);state.examTimer=null;const qs=DATA.questions.filter(x=>x.section===state.mode);for(const q of qs){const input=state.exam.answers[q.id]||'';if(q.kind==='write')continue;const good=q.kind==='mc'?input===q.answer:isCorrectTerm(q,input);record(q,good); }showExamResults();}
function showExamResults(){const exam=state.exam,qs=DATA.questions.filter(x=>x.section===state.mode);let auto=0,essay=0,known=0,unknown=0;
 for(const q of qs){const mine=exam.answers[q.id]||'',el=$(`#result-${q.id}`);if(!el)continue;el.classList.remove('invis');const truth=q.kind==='mc'?`${q.answer}．${q.options['ABCD'.indexOf(q.answer)]}`:q.answer;const ok=q.kind==='mc'?mine===q.answer:q.kind==='term'?isCorrectTerm(q,mine):null;
 if(ok)auto+=4;
 if(q.kind==='write'){if(exam.manual[q.id]===true){essay+=4;known++}else if(exam.manual[q.id]===false){unknown++;}
  el.innerHTML=`<b>模範解答：</b>${esc(truth)}<p>${esc(q.why)}</p><div class="actions"><button class="btn ${exam.manual[q.id]===true?'primary':''}" onclick="scoreEssay('${q.id}',true)">採点要素を満たした +4点</button><button class="btn ${exam.manual[q.id]===false?'primary':''}" onclick="scoreEssay('${q.id}',false)">要復習 +0点</button></div>`;
 }else{el.innerHTML=`<b style="color:${ok?'#18784e':'#ae3e50'}">${ok?'正解':'不正解・未回答'}</b><div><b>正答：</b>${esc(truth)}</div><p>${esc(q.why)}</p>`;}
 if(q.kind==='mc')$$(`[data-q="${q.id}"]`).forEach(x=>{x.disabled=true;x.classList.toggle('correct',x.dataset.choice===q.answer);x.classList.toggle('wrong',x.dataset.choice===mine && !ok);}); else{const inp=$(`[data-exam-text="${q.id}"]`);if(inp)inp.disabled=true;}
 }
 let pending=qs.filter(q=>q.kind==='write').length-known-unknown;
 const board=$('#scoreBoard');if(board)board.innerHTML=`<div class="scorecard" style="margin:18px 0"><div><b>採点結果</b><div class="mini muted">記述3問は自己採点してください（未採点${pending}問）</div></div><div class="score-big">${auto+essay}<span class="mini muted"> / 100</span></div></div><div class="intro-step"><div class="headline">復習の優先順位</div><p>誤答・未回答の設問は「間違えた問題」モードに記録しました。記述は採点ボタンで記録されます。</p><button class="btn primary" onclick="reviewMistakes()">間違えた問題を復習</button></div>`;
 const timer=$('#timer');if(timer)timer.textContent='終了';}
function scoreEssay(id,good){state.exam.manual[id]=good;const q=DATA.questions.find(x=>x.id===id);record(q,good,true);showExamResults();}
function reviewMistakes(){setMode('復習');}
function markKey(evt){if(state.mode==='模試A'||state.mode==='模試B')return;if(evt.target.tagName==='INPUT'||evt.target.tagName==='TEXTAREA'||evt.target.tagName==='SELECT')return;if('1234'.includes(evt.key)){const q=itemsForStudy()[state.studyIndex];if(q?.kind==='mc'){const b=$(`[data-choice="${'ABCD'[+evt.key-1]}"]`);b?.click();}}}
$$('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
$('#unitSel').addEventListener('change',e=>{state.unit=e.target.value;state.studyIndex=0;state.show=false;state.selected='';state.typed='';render();});
$('#studyFilter').addEventListener('change',e=>{state.filter=e.target.value;state.studyIndex=0;state.show=false;state.selected='';render();});
window.addEventListener('keydown',markKey);
window.addEventListener('beforeunload',()=>{if(state.exam&&!state.exam.finished){/* No remote communication; session is intentionally local. */}});
render();
</script></body></html>
